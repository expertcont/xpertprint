name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Quarkus backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: expertprint-server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: expertprint-server/pom.xml

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Maven verify
        run: |
          set -o pipefail
          mvn -B -ntp -e verify 2>&1 | tee maven-verify.log

      - name: Upload Maven verify log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expertprint-server-maven-verify-log
          path: expertprint-server/maven-verify.log
          if-no-files-found: warn

      - name: Upload Quarkus build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: expertprint-server-quarkus-app
          path: expertprint-server/target/quarkus-app
          if-no-files-found: error

  docker-build:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: expertprint-server
          file: expertprint-server/Dockerfile
          push: false
          tags: expertprint-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent:
    name: Windows agent
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect .NET project
        id: detect
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path expertprint-agent -Recurse -Include *.sln,*.csproj -File | Select-Object -First 1
          if ($null -ne $project) {
            "has_project=true" >> $env:GITHUB_OUTPUT
            "project_path=$($project.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "Detected .NET project: $($project.FullName)"
          } else {
            "has_project=false" >> $env:GITHUB_OUTPUT
            Write-Host "No .NET project found under expertprint-agent yet. Skipping restore/build."
          }

      - name: Set up .NET 8
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore agent
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet restore "${{ steps.detect.outputs.project_path }}"

      - name: Build agent
        if: steps.detect.outputs.has_project == 'true'
        run: dotnet build "${{ steps.detect.outputs.project_path }}" --configuration Release --no-restore
