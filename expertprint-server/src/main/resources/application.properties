quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.limits.max-body-size=2M
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/expertcont}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.max-size=12
expertprint.internal-key=${EXPERTPRINT_INTERNAL_KEY:CHANGE_ME}
expertprint.storage-dir=${EXPERTPRINT_STORAGE_DIR:/data/pdfs}
