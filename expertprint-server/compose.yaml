services:
  expertprint:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      DB_JDBC_URL: ${DB_JDBC_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EXPERTPRINT_INTERNAL_KEY: ${EXPERTPRINT_INTERNAL_KEY}
      EXPERTPRINT_STORAGE_DIR: /data/pdfs
    volumes:
      - expertprint_pdfs:/data/pdfs
volumes:
  expertprint_pdfs:
